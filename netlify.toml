[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 and Prisma 7 both require Node 18+; the app is developed on 22.
  NODE_VERSION = "22"

# Netlify installs this automatically; declaring it pins the Next.js runtime.
[[plugins]]
  package = "@netlify/plugin-nextjs"
